name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release Version (e.g., 1.5.0 for GA or 1.5.0-rc1 for RC)'
        required: true
        type: string

# Declare default permissions as read only
permissions:
  contents: read

jobs:
  prepare-release-artifacts:
    name: Prepare Release Artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          javaVersion: "21"

      - name: Prepare release artifacts
        uses: strimzi/github-actions/.github/actions/build/release-artifacts@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          releaseVersion: ${{ inputs.releaseVersion }}
          artifactSuffix: "kafka-kubernetes-config-provider"

      - name: Deploy to Maven Central
        uses: strimzi/github-actions/.github/actions/build/deploy-java@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          modules: "./"
          gpgPassphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpgSigningKey: ${{ secrets.GPG_SIGNING_KEY }}
          centralUsername: ${{ secrets.CENTRAL_USERNAME }}
          centralPassword: ${{ secrets.CENTRAL_PASSWORD }}

  # Signs the release archive with Sigstore and re-uploads the artifact with the provenance bundle.
  # Consumers run `gh attestation verify <archive> --repo strimzi/kafka-kubernetes-config-provider`.
  attest:
    name: Attestation
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      # OIDC token for Sigstore signing
      id-token: write
      # GitHub Attestation API
      attestations: write
    uses: strimzi/github-actions/.github/workflows/reusable-attest.yml@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
    with:
      artifactSuffix: "kafka-kubernetes-config-provider"
      releaseVersion: ${{ inputs.releaseVersion }}

  snyk-scan:
    name: Snyk Scan
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/snyk.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  fossa-scan:
    name: FOSSA Scan
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fossa.yml
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
